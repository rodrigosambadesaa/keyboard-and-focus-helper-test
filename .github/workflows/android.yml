name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify exact pinned Gist source
        shell: bash
        run: |
          set -euo pipefail
          RAW_URL="https://gist.githubusercontent.com/rodrigosambadesaa/fcf03abc572f23286d13755344595de7/raw/e4d47500bd1658d3134b39a4c10e4072984da580/KeyboardAndFocusHelper.kt"
          curl --fail --location --silent --show-error "$RAW_URL" --output /tmp/KeyboardAndFocusHelper.kt
          cmp --silent /tmp/KeyboardAndFocusHelper.kt app/src/main/java/KeyboardAndFocusHelper.kt || {
            echo "Repository source differs from the pinned Gist revision." >&2
            diff --unified /tmp/KeyboardAndFocusHelper.kt app/src/main/java/KeyboardAndFocusHelper.kt || true
            exit 1
          }
      - name: Install SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and run unit tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-apk-and-tests
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
          if-no-files-found: ignore

  emulator:
    needs: unit-tests
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - api-level: 30
            runner: macos-26-intel
          - api-level: 23
            runner: macos-15-intel
          - api-level: 28
            runner: macos-15-intel
          - api-level: 35
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -e
            adb wait-for-device
            for i in $(seq 1 90); do
              if adb shell service check package 2>/dev/null | grep -q "found"; then
                break
              fi
              sleep 2
            done
            adb shell service check package | grep -q "found"
            adb shell settings put secure show_ime_with_hard_keyboard 1 || true

            # These must pass on every API: general contracts for the exact Gist
            # plus the corrected implementation's IME regression.
            gradle --no-daemon :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=dev.rodrigosambade.keyboardtest.KeyboardDeviceTest,dev.rodrigosambade.keyboardtest.FixedKeyboardDeviceTest

            # Keep testing the exact Gist's IME behavior. API 30 currently
            # reproduces the AndroidX controller-path regression documented in
            # the repository, so record it without masking failures in the fixed
            # implementation or in the general contract suite.
            if [ "${{ matrix.api-level }}" = "30" ]; then
              set +e
              gradle --no-daemon :app:connectedDebugAndroidTest \
                -Pandroid.testInstrumentationRunnerArguments.class=dev.rodrigosambade.keyboardtest.OriginalGistImeRegressionTest
              ORIGINAL_GIST_STATUS=$?
              set -e
              if [ "$ORIGINAL_GIST_STATUS" -eq 0 ]; then
                echo "::notice::Exact Gist API 30 IME regression did not reproduce on this run."
              else
                echo "::warning::Exact Gist reproduced the known API 30 IME visibility regression; corrected implementation passed separately."
              fi
            else
              gradle --no-daemon :app:connectedDebugAndroidTest \
                -Pandroid.testInstrumentationRunnerArguments.class=dev.rodrigosambade.keyboardtest.OriginalGistImeRegressionTest
            fi

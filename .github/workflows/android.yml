name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify exact pinned Gist source
        shell: bash
        run: |
          set -euo pipefail
          RAW_URL="https://gist.githubusercontent.com/rodrigosambadesaa/fcf03abc572f23286d13755344595de7/raw/e4d47500bd1658d3134b39a4c10e4072984da580/KeyboardAndFocusHelper.kt"
          curl --fail --location --silent --show-error "$RAW_URL" --output /tmp/KeyboardAndFocusHelper.kt
          cmp --silent /tmp/KeyboardAndFocusHelper.kt app/src/main/java/KeyboardAndFocusHelper.kt || {
            echo "Repository source differs from the pinned Gist revision." >&2
            diff --unified /tmp/KeyboardAndFocusHelper.kt app/src/main/java/KeyboardAndFocusHelper.kt || true
            exit 1
          }
      - name: Install SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and run unit tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-apk-and-tests
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
          if-no-files-found: ignore

  emulator:
    needs: unit-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 28, 30, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1 || true
            gradle --no-daemon :app:connectedDebugAndroidTest

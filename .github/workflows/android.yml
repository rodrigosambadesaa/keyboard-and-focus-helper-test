name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build and test
        run: |
          gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-apk-and-tests
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
          if-no-files-found: ignore

  emulator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 28, 30, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1 || true
            gradle --no-daemon :app:connectedDebugAndroidTest
